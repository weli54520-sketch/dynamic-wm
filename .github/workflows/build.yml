name: Build
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2
      # مفتاح التوقيع: من Secrets لو موجود، وإلا مفتاح مؤقت (التحديث الداخلي ما يركب فوق القديم)
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.DWM_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.DWM_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DWM_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/dwm.jks"
            echo "DWM_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "DWM_KEY_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "DWM_KEY_ALIAS=${KS_ALIAS:-dwm}" >> "$GITHUB_ENV"
            echo "Signing with the permanent key from secrets"
          else
            echo "::warning::DWM_KEYSTORE_BASE64 secret not set - signing with a temporary key"
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/dwm.jks" -storepass "$PASS" -keypass "$PASS" -alias dwm \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Dynamic WM, O=WM, C=SA"
            echo "DWM_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "DWM_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "DWM_KEY_ALIAS=dwm" >> "$GITHUB_ENV"
          fi
          echo "DWM_KEYSTORE=$RUNNER_TEMP/dwm.jks" >> "$GITHUB_ENV"
      - run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk dynamic-wm.apk
      # كل بناء ينحفظ كملف تقدر تنزله من صفحة Actions
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-wm-apk
          path: dynamic-wm.apk
      # الإصدار (للتحديث الداخلي) يطلع بس من main، عشان ما تكثر الإصدارات
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Dynamic WM 1.${{ github.run_number }}
          files: dynamic-wm.apk
      # نخلي آخر إصدارين بس: الجديد، واللي قبله للرجوع لو صار عطل
      - if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r tag; do
            [ -n "$tag" ] && gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
