plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// رقم الإصدار = رقم البناء في GitHub
def buildNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.wm.dynamic'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wm.dynamic'
        minSdk 30
        targetSdk 35
        versionCode buildNo
        versionName "1." + buildNo
    }

    // مفتاح التوقيع يجي من GitHub Secrets (ما ينحفظ في المستودع).
    // مفتاح ثابت = كل تحديث ينزل فوق القديم بدون حذف.
    def ksPath = System.getenv("DWM_KEYSTORE")
    signingConfigs {
        dwm {
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("DWM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("DWM_KEY_ALIAS")
                keyPassword System.getenv("DWM_KEY_PASSWORD")
            } else {
                def dbg = file("${System.getProperty('user.home')}/.android/debug.keystore")
                storeFile dbg
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.dwm
        }
        debug {
            signingConfig signingConfigs.dwm
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.savedstate:savedstate-ktx:1.2.1'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
